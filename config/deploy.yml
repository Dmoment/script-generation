# Kamal deployment configuration for script_generation.
# Shares the Hetzner server (and kamal-proxy) with StmtIQ; each app is a
# separate kamal-proxy service routed by hostname.
# Docs: https://kamal-deploy.org/

service: script_generation

image: <%= ENV['DOCKER_REGISTRY_USERNAME'] || 'modestmoron' %>/script_generation

servers:
  web:
    hosts:
      - <%= ENV['DEPLOY_SERVER_IP'] || '135.181.255.190' %>

# SSL via Let's Encrypt, routed by hostname on the shared kamal-proxy
proxy:
  ssl: true
  host: <%= ENV['DEPLOY_HOST'] || 'script-generation.135.181.255.190.sslip.io' %>
  healthcheck:
    path: /up
    interval: 10
    timeout: 5

registry:
  username: <%= ENV['DOCKER_REGISTRY_USERNAME'] || 'modestmoron' %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - AUTH0_CLIENT_SECRET
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: true
    RAILS_SERVE_STATIC_FILES: true

    # Hostname used for config.hosts and mailer URLs
    APP_HOST: <%= ENV['DEPLOY_HOST'] || 'script-generation.135.181.255.190.sslip.io' %>

    # Auth0 (public SPA values; also baked into the JS bundle at build time)
    AUTH0_DOMAIN: <%= ENV['AUTH0_DOMAIN'] || 'dev-83y3hw5jpx7swsa3.us.auth0.com' %>
    AUTH0_CLIENT_ID: <%= ENV['AUTH0_CLIENT_ID'] || '8jLHiPYD0Y5fBVfx1rYskHcTiX7d2wyi' %>
    AUTH0_AUDIENCE: <%= ENV['AUTH0_AUDIENCE'] || 'https://script-generation.onrender.com/' %>

    # Active Storage (S3)
    AWS_REGION: <%= ENV['AWS_REGION'] || 'us-east-1' %>
    AWS_S3_BUCKET: <%= ENV['AWS_S3_BUCKET'] || 'script-generation-production' %>

    # Run Solid Queue inside Puma (single server setup)
    SOLID_QUEUE_IN_PUMA: true

# Persistent storage for local Active Storage files
volumes:
  - "script_generation_storage:/rails/storage"

# Bridge fingerprinted assets between versions
asset_path: /rails/public/assets

builder:
  arch: amd64
  args:
    AUTH0_DOMAIN: <%= ENV['AUTH0_DOMAIN'] || 'dev-83y3hw5jpx7swsa3.us.auth0.com' %>
    AUTH0_CLIENT_ID: <%= ENV['AUTH0_CLIENT_ID'] || '8jLHiPYD0Y5fBVfx1rYskHcTiX7d2wyi' %>
    AUTH0_AUDIENCE: <%= ENV['AUTH0_AUDIENCE'] || 'https://script-generation.onrender.com/' %>

ssh:
  user: root

# Dedicated PostgreSQL for this app. StmtIQ's Postgres already owns host
# port 5432, so this one is published on 127.0.0.1:5433 (host-only, for
# debugging); the app reaches it as `script-generation-db` (network alias) on the kamal network.
accessories:
  db:
    image: postgres:16
    host: <%= ENV['DEPLOY_SERVER_IP'] || '135.181.255.190' %>
    port: "127.0.0.1:5433:5432"
    env:
      clear:
        POSTGRES_DB: script_generation_production
        POSTGRES_USER: script_generation
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
    # Ruby's URI parser rejects underscores in hostnames, so the app connects
    # via this hyphenated alias instead of the container name.
    options:
      network-alias: script-generation-db

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
  migrate: app exec "bin/rails db:migrate"
